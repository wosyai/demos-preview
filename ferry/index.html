<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102726">
<meta name="description" content="Last Ferry, a playable third-person seaside game made in Wosy.">
<title>Last Ferry | Wosy Arcade</title>
<link rel="stylesheet" href="./style.css?v=ferry-mobile-hud-v5-arcade-ui4">
  <link rel="stylesheet" href="../arcade/shell.css?v=4">
</head>
<body class="arcade-city">
<main class="stage" aria-label="Last Ferry">
  <canvas id="view" aria-label="Third-person game view"></canvas>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-route" viewBox="0 0 24 24"><path d="M12 3 5 19l7-4 7 4-7-16Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-time" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke-width="3"/></symbol>
    <symbol id="icon-enter" viewBox="0 0 24 24"><path d="M12 4h7v16h-7M4 12h11m-4-4 4 4-4 4"/></symbol>
    <symbol id="icon-exit" viewBox="0 0 24 24"><path d="M12 4H5v16h7m-2-8h10m-4-4 4 4-4 4"/></symbol>
    <symbol id="icon-tape" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="10" r="2"/><circle cx="16" cy="10" r="2"/><path d="M7 19l2-4h6l2 4"/></symbol>
    <symbol id="icon-board" viewBox="0 0 24 24"><path d="M4 14h16l-3 4H7l-3-4Zm4 0V8h8v6m-6-6V5h4m-9 16q2-2 4 0 3 2 6 0 2-2 4 0"/></symbol>
    <symbol id="icon-avenue" viewBox="0 0 24 24"><path d="M20 18h-9a5 5 0 0 1 0-10h6l-3-3m3 3-3 3"/></symbol>
    <symbol id="icon-waterfront" viewBox="0 0 24 24"><path d="M7 11c-3 0-4-3-3-5s3-2 4 0l1 3q1 2-2 2Zm0 3 3-1 1 3-3 1Zm8 3c-3 0-4-3-3-5s3-2 4 0l1 3q1 2-2 2Zm0 3 3-1 1 3-3 1Z"/></symbol>
    <symbol id="icon-phone" viewBox="0 0 24 24"><path d="M7 3 4 5c-1 5 7 13 12 15l4-3-3-4-3 2c-2-1-4-3-5-5l2-2-4-5Z"/></symbol>
    <symbol id="icon-power" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6M6 10l6-6 6 6"/></symbol>
    <symbol id="icon-brake" viewBox="0 0 24 24"><rect x="7" y="5" width="10" height="14" rx="2"/><path d="M10 9h4m-4 3h4m-4 3h4"/></symbol>
    <symbol id="icon-sprint" viewBox="0 0 24 24"><path d="M13 3a1 1 0 1 0 0 .1m-3 6 3-3 3 5h4M7 13l4 1 2-4m0 4 3 5m-6-3-5 4"/></symbol>
  </svg>
  <div id="play-hud" class="play-hud" hidden>
  <header class="deck" aria-label="Game information">
    <div id="trip" class="trip"><svg class="icon" aria-hidden="true"><use href="#icon-route" id="bearing"/></svg><strong id="objective">Answer the phone</strong><span id="status"></span></div>
    <div id="departure" class="departure" hidden><svg class="icon" aria-hidden="true"><use href="#icon-time"/></svg><strong id="clock" aria-label="Time remaining">--:--</strong></div>
    <div class="deck-actions">
      <button id="camera-view" type="button" class="quiet" aria-label="Switch camera view" title="Switch camera view (C)" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M8 6l1-2h6l1 2"/></svg></button>
      <button id="pause" type="button" class="quiet" aria-label="Pause game" disabled><svg class="icon" aria-hidden="true"><use href="#icon-pause"/></svg></button>
    </div>
    <p id="hint" class="hint" hidden></p>
  </header>
  <details id="city-map" class="city-map" hidden>
    <summary>Route map</summary>
    <canvas id="city-chart" width="224" height="152" aria-hidden="true"></canvas>
    <p>White: you. Gold: next stop.</p>
  </details>
  </div>
  <div id="touch" class="touch" hidden>
    <div id="wheel" class="wheel" aria-label="Drag to steer or move"><div class="ring"><span id="thumb"></span></div></div>
    <div class="pedals">
      <button id="power" type="button" aria-label="Accelerate"><svg class="icon" aria-hidden="true"><use href="#icon-power"/></svg></button>
      <button id="brake" type="button" aria-label="Brake"><svg class="icon" aria-hidden="true"><use id="brake-icon" href="#icon-brake"/></svg></button>
      <button id="action" type="button" aria-label="Interact" hidden><svg class="icon" aria-hidden="true"><use id="action-icon" href="#icon-enter"/></svg><span id="action-caption">Interact</span></button>
    </div>
  </div>
  <section id="panel" class="lobby arcade-stage" data-intro="true" aria-labelledby="title">
    <nav class="arcade-menu-tools arcade-rail" aria-label="Arcade menu">
      <a class="arcade-back" href="../" aria-label="Back to Wosy Arcade"><svg class="arcade-tool-icon" aria-hidden="true" focusable="false"><use href="../arcade/icons.svg?v=2#back"></use></svg> Arcade</a>
      <details class="arcade-settings">
        <summary><svg class="arcade-tool-icon" aria-hidden="true" focusable="false"><use href="../arcade/icons.svg?v=2#settings"></use></svg> Controls</summary>
        <div class="arcade-settings-body">
          <strong>Driving controls</strong><div class="keys"><p id="guide">WASD or arrows to move, Space to brake or sprint, E to interact, C to switch camera, Esc to pause.</p></div>
        </div>
      </details>
    </nav>
    <div class="panel-inner arcade-copy">
      <p class="arcade-genre">Night drive</p>
      <h1 id="title">Last Ferry</h1>
      <p id="summary" class="arcade-deck">Pick up the tape and make the last sailing.</p>
      <div class="launch"><button id="start" type="button" disabled>Loading…</button><button id="roam" type="button" disabled>Free roam</button></div>
    </div>
    <div class="arcade-cover" aria-hidden="true"><svg><use href="../arcade/covers.svg?v=1#city"></use></svg></div>
  </section>
  <span id="announce" class="sr-only" aria-live="polite"></span>
</main>
<script type="module" src="./host.mjs?v=ferry-mobile-hud-v5-arcade-ui4"></script>
</body>
</html>
