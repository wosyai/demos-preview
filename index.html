<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#141c24">
  <title>Wosy Arcade</title>
  <link rel="stylesheet" href="./arcade/shell.css?v=4">
  <link rel="stylesheet" href="./arcade/catalog.css?v=1">
</head>
<body class="arcade-home">
<main class="arcade-catalog">
  <header class="catalog-heading">
    <span>Wosy / Games</span>
    <h1>Wosy Arcade</h1>
    <p>Three games built with Wosy. Play right in your browser.</p>
  </header>
  <ul class="catalog-games">
    <li class="arcade-air">
      <a class="catalog-game" href="./flight/" aria-labelledby="flight-title">
        <div class="arcade-cover" aria-hidden="true"><svg><use href="./arcade/covers.svg?v=1#air"></use></svg></div>
        <div class="catalog-label"><span>Pioneer aviation</span><h2 id="flight-title">Flying Low</h2></div>
        <svg class="catalog-play" viewBox="0 0 24 24" fill="none" aria-hidden="true"><use href="./arcade/icons.svg?v=2#next"></use></svg>
      </a>
    </li>
    <li class="arcade-island">
      <a class="catalog-game" href="./voxel/" aria-labelledby="voxel-title">
        <div class="arcade-cover" aria-hidden="true"><svg><use href="./arcade/covers.svg?v=1#island"></use></svg></div>
        <div class="catalog-label"><span>Voxel adventure</span><h2 id="voxel-title">Pocket Island</h2></div>
        <svg class="catalog-play" viewBox="0 0 24 24" fill="none" aria-hidden="true"><use href="./arcade/icons.svg?v=2#next"></use></svg>
      </a>
    </li>
    <li class="arcade-city">
      <a class="catalog-game" href="./ferry/" aria-labelledby="ferry-title">
        <div class="arcade-cover" aria-hidden="true"><svg><use href="./arcade/covers.svg?v=1#city"></use></svg></div>
        <div class="catalog-label"><span>Night drive</span><h2 id="ferry-title">Last Ferry</h2></div>
        <svg class="catalog-play" viewBox="0 0 24 24" fill="none" aria-hidden="true"><use href="./arcade/icons.svg?v=2#next"></use></svg>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
