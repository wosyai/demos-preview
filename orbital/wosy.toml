[package]
name = "orbital"
default_target = "app"

[comments]
categories = []

[builders.web]
command = ["python3", "./build-wasm.py"]
args = []
toolchain_identity = "llvm-18.1.8;wosy-orbital-browser-v1"

[runners.web]
command = ["node", "./verify-wasm.mjs"]
args = []

[targets.app]
root = "engine.w"

[targets.app.artifacts.main]
artifact = "Main"

[targets.app.artifacts.main.profiles.dev]
backend = "llvm"
output = "wasm-wasip1"
builder = "web"
run_runner = "web"

[targets.app.artifacts.main.profiles.dev.exports]
reset = "reset"
tick = "tick"
select_deck = "select_deck"
select_arm = "select_arm"
set_thrust = "set_thrust"
set_rotator = "set_rotator"
select_reentry = "select_reentry"
camera_clip = "camera_clip"
hud_code = "hud_code"
scenery_motion = "scenery_motion"
entry_flow = "entry_flow"
project_visual = "project_visual"
camera_mode = "camera_mode"
globe_tiles = "globe_tiles"
reentry_shell = "reentry_shell"
reentry_visual = "reentry_visual"
input_key = "input_key"
input_action = "input_action"
input_clear = "input_clear"
input_release = "input_release"
input_pointer = "input_pointer"
input_stick = "input_stick"
input_status = "input_status"
input_advance = "input_advance"
quality_adapt = "quality_adapt"
quality_plan = "quality_plan"
quality_shadow = "quality_shadow"
hud_view = "hud_view"
celestial_profile = "celestial_profile"
draw_plan = "draw_plan"
sky_plan = "sky_plan"
globe_request = "globe_request"
globe_retry = "globe_retry"
material_profile = "material_profile"
avatar_grip = "avatar_grip"
avatar_approach = "avatar_approach"
avatar_facing = "avatar_facing"
avatar_mmu = "avatar_mmu"
avatar_elbow = "avatar_elbow"

[targets.app.profiles.dev]
main_artifact = "main"
